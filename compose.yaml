name: event-hub

services:
  db:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-eventhub}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-eventhub}
      POSTGRES_DB: ${POSTGRES_DB:-eventhub}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      # PostgreSQL 18+ images keep PGDATA under /var/lib/postgresql/<major>/docker
      - db-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  back:
    build:
      context: ./back
      target: dev
    init: true
    environment:
      PORT: 3000
      DATABASE_URL: postgresql://${POSTGRES_USER:-eventhub}:${POSTGRES_PASSWORD:-eventhub}@db:5432/${POSTGRES_DB:-eventhub}
      # File events from the host do not reach the container through the bind mount (Docker Desktop on macOS):
      # make the watcher bundled in `tsx watch` poll instead.
      CHOKIDAR_USEPOLLING: "true"
      CHOKIDAR_INTERVAL: "300"
    ports:
      - "${BACK_PORT:-3000}:3000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./back/src:/app/src
      - ./back/prisma:/app/prisma
      - ./back/openapi.yaml:/app/openapi.yaml

  prism:
    image: stoplight/prism:5
    profiles: ["mock"]
    command: ["mock", "-h", "0.0.0.0", "-p", "4010", "--multiprocess=false", "/spec/openapi.contract.yaml"]
    ports:
      - "${PRISM_PORT:-4010}:4010"
    volumes:
      - ./front/openapi.contract.yaml:/spec/openapi.contract.yaml:ro

  front:
    build:
      context: ./front
      target: dev
    profiles: ["front"]
    init: true
    environment:
      NEXT_PUBLIC_API_BASE_URL: /api
      API_EVENTS_BASE: ${API_EVENTS_BASE:-http://back:3000/api}
      API_MOCK_BASE: ${API_MOCK_BASE:-http://prism:4010}
      WATCHPACK_POLLING: "true"
    ports:
      - "${FRONT_PORT:-3001}:3001"
    depends_on:
      - back
    volumes:
      - ./front/src:/app/src
      - ./front/public:/app/public
      - ./front/next.config.ts:/app/next.config.ts
      - ./front/openapi.contract.yaml:/app/openapi.contract.yaml

  storybook:
    build:
      context: ./front
      target: dev
    profiles: ["storybook"]
    init: true
    environment:
      CHOKIDAR_USEPOLLING: "true"
    ports:
      - "${STORYBOOK_PORT:-6006}:6006"
    command: ["npx", "storybook", "dev", "--host", "0.0.0.0", "-p", "6006", "--no-open"]
    volumes:
      - ./front/src:/app/src
      - ./front/.storybook:/app/.storybook
      - ./front/public:/app/public
      - ./front/next.config.ts:/app/next.config.ts

volumes:
  db-data:
