name: Front CI & Storybook

on:
  push:
    branches: [main]
    paths:
      - "front/**"
      - ".github/workflows/front-ci.yml"
  pull_request:
    paths:
      - "front/**"
      - ".github/workflows/front-ci.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages-storybook"
  cancel-in-progress: true

jobs:
  check:
    name: Lint, Typecheck, Tests & Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: front
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: front/package-lock.json

      - run: npm ci
      - run: npm run api:generate
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm run build-storybook

      - name: Upload Storybook artifact for GitHub Pages
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: front/storybook-static

  audit:
    name: Rapport RGAA & SEO
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: front
    env:
      # À adapter à votre projet
      SERVE_COMMAND: "npx next start -p 3001"
      BASE_URL: "http://localhost:3001"
      # Utilisées par le front, au build comme au démarrage
      NEXT_PUBLIC_API_BASE_URL: /api
      API_EVENTS_BASE: "http://localhost:3000/api"
      API_MOCK_BASE: "http://localhost:4010"
      PAGES: "/" # chemins séparés par des espaces, ex. "/ /contact /connexion"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: front/package-lock.json

      - name: Démarrer la base, le back et le mock
        working-directory: .
        run: |
          docker compose --profile mock up -d --build --wait db back prism
          # Toute réponse HTTP, même 404, prouve que le service écoute
          for url in http://localhost:3000/ http://localhost:4010/; do
            curl --silent --show-error --output /dev/null \
              --retry 30 --retry-delay 2 --retry-all-errors "$url"
          done

      - run: npm ci
      - run: npm run api:generate
      - run: npm run build

      - name: Installer les outils d'audit
        run: npm install --global "@axe-core/cli@^4.11" "@lhci/cli@0.15"

      - name: Démarrer le site
        run: |
          nohup bash -c "$SERVE_COMMAND" > "$RUNNER_TEMP/server.log" 2>&1 &
          if ! curl --silent --fail --output /dev/null \
            --retry 30 --retry-delay 2 --retry-all-errors "$BASE_URL"; then
            cat "$RUNNER_TEMP/server.log"
            exit 1
          fi

      - name: Audit RGAA (axe-core)
        run: |
          reports="$PWD/audit-reports/rgaa"
          mkdir -p "$reports" "$RUNNER_TEMP/axe"
          urls=()
          for page in $PAGES; do urls+=("$BASE_URL$page"); done
          # Hors de front/ : évite qu'axe charge l'axe-core du projet
          cd "$RUNNER_TEMP/axe"
          axe "${urls[@]}" \
            --tags RGAAv4 \
            --load-delay 2000 \
            --chromedriver-path "$CHROMEWEBDRIVER/chromedriver" \
            --chrome-options="no-sandbox,disable-dev-shm-usage" \
            --dir . \
            --save axe.json
          cp axe.json "$reports/"

      - name: Audit SEO (Lighthouse)
        if: ${{ !cancelled() }}
        run: |
          node <<'EOF'
          const { BASE_URL, PAGES, RUNNER_TEMP } = process.env;
          const url = PAGES.trim().split(/\s+/).map((page) => BASE_URL + page);
          const config = {
            ci: {
              collect: {
                url,
                numberOfRuns: 1,
                settings: { onlyCategories: ["seo"] },
              },
              upload: { target: "filesystem", outputDir: "./audit-reports/seo" },
            },
          };
          require("fs").writeFileSync(
            `${RUNNER_TEMP}/lighthouserc.json`,
            JSON.stringify(config),
          );
          EOF
          lhci collect --config="$RUNNER_TEMP/lighthouserc.json"
          lhci upload --config="$RUNNER_TEMP/lighthouserc.json"

      - name: Générer la synthèse
        if: ${{ !cancelled() }}
        run: |
          node <<'EOF'
          const fs = require("fs");
          const read = (file) =>
            fs.existsSync(file) ? JSON.parse(fs.readFileSync(file, "utf8")) : null;
          const cell = (text) =>
            String(text).replace(/\|/g, "\\|").replace(/</g, "&lt;").replace(/\n/g, " ");
          const out = ["# Rapport RGAA & SEO", "", "## RGAA (tests automatiques)", ""];
          out.push(
            "> Contrôle partiel : ce rapport ne donne pas un taux de conformité RGAA. " +
              "Un audit manuel reste nécessaire.",
            "",
          );

          const axe = read("audit-reports/rgaa/axe.json");
          if (!axe) out.push("⚠️ Rapport axe absent : consultez les logs.", "");
          for (const page of axe ?? []) {
            out.push(`### ${page.url}`, "");
            out.push(
              `Règles en échec : **${page.violations.length}** · ` +
                `à vérifier manuellement : **${page.incomplete.length}** · ` +
                `réussies : ${page.passes.length}`,
              "",
            );
            const rows = [
              ...page.violations.map((rule) => ["❌ Échec", rule]),
              ...page.incomplete.map((rule) => ["🔎 À vérifier", rule]),
            ];
            if (!rows.length) continue;
            out.push("| Statut | Tests RGAA | Problème | Impact | Éléments |");
            out.push("|---|---|---|---|---|");
            for (const [status, rule] of rows) {
              const tests = rule.tags
                .filter((tag) => /^RGAA-\d/.test(tag))
                .map((tag) => tag.slice(5))
                .join(", ");
              out.push(
                `| ${status} | ${tests || "-"} | [${cell(rule.help)}](${rule.helpUrl}) ` +
                  `| ${rule.impact ?? "-"} | ${rule.nodes.length} |`,
              );
            }
            out.push("");
          }

          out.push("## SEO (Lighthouse)", "");
          const manifest = read("audit-reports/seo/manifest.json");
          if (!manifest) out.push("⚠️ Rapport Lighthouse absent : consultez les logs.", "");
          for (const run of manifest ?? []) {
            const report = read(run.jsonPath);
            const score = run.summary.seo;
            out.push(`### ${run.url}`, "");
            out.push(
              `Score : **${score == null ? "indisponible" : Math.round(score * 100) + "/100"}**`,
              "",
            );
            if (report.runtimeError) out.push(`⚠️ ${report.runtimeError.message}`, "");
            const failed = report.categories.seo.auditRefs
              .map((ref) => report.audits[ref.id])
              .filter((audit) => audit.score !== null && audit.score < 1);
            for (const audit of failed) out.push(`- ❌ ${cell(audit.title)}`);
            out.push("");
          }

          const markdown = out.join("\n") + "\n";
          fs.mkdirSync("audit-reports", { recursive: true });
          fs.writeFileSync("audit-reports/synthese.md", markdown);
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, markdown);
          EOF

      - name: Contrôles complémentaires (sitemap, favicon, partage)
        if: ${{ !cancelled() }}
        run: |
          node <<'EOF'
          const fs = require("fs");
          const { BASE_URL, PAGES, GITHUB_STEP_SUMMARY } = process.env;

          async function get(url) {
            try {
              const res = await fetch(url, { signal: AbortSignal.timeout(15000) });
              const body = Buffer.from(await res.arrayBuffer());
              const type = res.headers.get("content-type") ?? "";
              return { ok: res.status === 200, status: res.status, type, size: body.length, text: body.toString() };
            } catch (error) {
              return { ok: false, status: error.message, type: "", size: 0, text: "" };
            }
          }

          // Lit les attributs de chaque balise <link> ou <meta>
          const tags = (html, name) =>
            [...html.replace(/<!--[\s\S]*?-->/g, "").matchAll(new RegExp(`<${name}\\s[^>]*>`, "gi"))].map(([tag]) =>
              Object.fromEntries(
                [...tag.matchAll(/([\w:-]+)\s*=\s*(?:"([^"]*)"|'([^']*)')/g)].map((m) => [
                  m[1].toLowerCase(),
                  (m[2] ?? m[3]).replace(/&amp;/g, "&"),
                ]),
              ),
            );
          const rels = (link) => (link.rel ?? "").toLowerCase().split(/\s+/);

          (async () => {
            const rows = [];
            const add = (ok, check, detail) =>
              rows.push(`| ${ok ? "✅" : "❌"} | ${check} | ${String(detail).replace(/\|/g, "\\|")} |`);

            const robots = await get(new URL("/robots.txt", BASE_URL));
            const hasRobots = robots.ok && robots.type.startsWith("text/plain");
            add(hasRobots, "robots.txt", `HTTP ${robots.status}`);

            // Sitemaps déclarés dans robots.txt, sinon /sitemap.xml ; testés sur le site local
            const declared = hasRobots
              ? [...robots.text.matchAll(/^\s*sitemap:\s*(\S+)/gim)].map((m) => m[1])
              : [];
            add(declared.length > 0, "Sitemap déclaré dans robots.txt", declared.join(", ") || "aucun");
            for (const entry of declared.length ? declared : ["/sitemap.xml"]) {
              const { pathname, search } = new URL(entry, BASE_URL);
              const map = await get(new URL(pathname + search, BASE_URL));
              const valid = map.ok && /<(urlset|sitemapindex)[\s>]/.test(map.text) && /<loc>/.test(map.text);
              add(valid, `Sitemap ${pathname}`, `HTTP ${map.status}`);
            }

            for (const path of PAGES.trim().split(/\s+/)) {
              const url = new URL(BASE_URL + path);
              const page = await get(url);
              if (!page.ok) {
                add(false, `Page ${path}`, `HTTP ${page.status}`);
                continue;
              }
              const links = tags(page.text, "link");
              const metas = tags(page.text, "meta");

              const declaredIcon = links.find((l) => rels(l).includes("icon") && l.href);
              const iconUrl = new URL(declaredIcon?.href ?? "/favicon.ico", url);
              const icon = await get(iconUrl);
              add(
                icon.ok && icon.size > 0 && /^(image\/|application\/octet-stream)/.test(icon.type),
                `Favicon (${path})`,
                `${declaredIcon ? "déclaré" : "non déclaré"}, ${iconUrl.pathname} : HTTP ${icon.status}`,
              );

              const canonical = links.find((l) => rels(l).includes("canonical"));
              add(Boolean(canonical?.href), `URL canonique (${path})`, canonical?.href || "absente");
              for (const property of ["og:title", "og:description", "og:image"]) {
                const found = metas.some((m) => m.property === property && m.content);
                add(found, `${property} (${path})`, found ? "présent" : "absent");
              }
            }

            const markdown = [
              "## Contrôles complémentaires (SEO et partage)",
              "",
              "| Statut | Contrôle | Détail |",
              "|---|---|---|",
              ...rows,
              "",
            ].join("\n");
            fs.mkdirSync("audit-reports", { recursive: true });
            fs.appendFileSync("audit-reports/synthese.md", markdown);
            fs.appendFileSync(GITHUB_STEP_SUMMARY, markdown);
          })();
          EOF

      - name: Afficher les logs en cas d'échec
        if: failure()
        working-directory: .
        run: |
          docker compose --profile mock logs --no-color --tail 200
          cat "$RUNNER_TEMP/server.log" || true

      - name: Publier les rapports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: rapport-rgaa-seo
          path: front/audit-reports
          if-no-files-found: warn
          retention-days: 30

  deploy-storybook:
    name: Publish Storybook on GitHub Pages
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: check
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4